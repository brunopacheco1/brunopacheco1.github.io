# Builds the site on every pull request (a check, nothing is published) and builds and deploys it
# to GitHub Pages on every push to master.
name: Build and deploy the site

on:
  push:
    branches: ["master"]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push to a pull request cancels its older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # keep in line with the Hugo used locally (see README); Congo 2.14 needs 0.158 or later
      HUGO_VERSION: 0.169.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go (Hugo modules download the theme with it)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Hugo (extended), checked against the release checksums
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl --proto '=https' --tlsv1.2 -fsSLO "${base}/${deb}"
          curl --proto '=https' --tlsv1.2 -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${deb}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check
          sudo dpkg -i "${deb}"
          hugo version
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          # empty on pull requests: the site keeps the baseURL from config.toml
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          args=(--gc --minify)
          if [ -n "${BASE_URL}" ]; then args+=(--baseURL "${BASE_URL}/"); fi
          hugo "${args[@]}"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
